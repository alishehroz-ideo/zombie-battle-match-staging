<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Zombie Battle Match</title>
    <link rel="icon" type="image/png" href="TemplateData/game-icon.png">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* ===== Ideofuzion template — responsive letterbox + loading UI =====
         All overrides live inline here because Unity regenerates TemplateData/style.css
         on every build; !important beats it. Zombie Battle Match is portrait, authored at exactly 9:16 (540x960:
         a fixed orthographic camera over a 7-wide puzzle board, as the client's own page framed it). The canvas
         is letterboxed to 9:16 on every other shape (see resizeCanvas). */

      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #0e0e12;
        touch-action: none;                 /* don't let the browser eat drags/clicks */
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      }

      /* Full-viewport shell. The game's own key art, blurred and darkened, sits behind the
         loading icon and progress bar so a player can tell what is loading.

         The blur is BAKED INTO THE JPG (Tools/bake_action_bg.py -> Tools/bake_loading_bg.py),
         never done here with filter: blur() — a full-screen filter is expensive on phones and
         this screen renders precisely while the device is busy downloading the wasm.

         `cover`, never `100% 100%`: cover crops, stretch distorts, and portrait art pulled
         across a wide letterboxed viewport looks broken.

         #0e0e12 stays underneath as the fallback while the JPG is in flight, and it is what
         paints the letterbox bars. It must match GROUND in bake_loading_bg.py.

         THE IMAGE IS TAKEN BACK OFF once Unity renders — search for
         `container.style.background` in the createUnityInstance().then() handler below. That
         teardown is half of this feature, not an extra: because this element paints the
         letterbox bars, leaving the image set keeps it on screen for the whole session (trap 14 /
         BP-1). The two halves are forty lines and one language apart, so each names the other.

         THE IMAGE IS TAKEN BACK OFF once Unity renders — search for
         `container.style.background` in the createUnityInstance().then() handler below. That
         teardown is half of this feature, not an extra: because this element paints the
         letterbox bars, leaving the image set keeps it on screen for the whole session. The
         two halves are forty lines and one language apart, so each names the other. */
      #unity-container {
        position: fixed; inset: 0;
        background: #0e0e12 url('TemplateData/loading-bg.jpg') center / cover no-repeat;
      }

      /* Canvas is positioned by JS (letterbox). Transparent so the backdrop shows through
         while loading; Unity fills it once the game renders. */
      #unity-canvas {
        display: block; position: absolute;
        background: transparent !important;
      }

      /* ---- Loading bar ---- */
      #unity-loading-bar {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        display: none; z-index: 10; text-align: center;
      }
      /* The icon box starts EMPTY and only paints the baked-in icon if the tenant lookup fails
         (JS adds .gb-fallback), so we never flash a placeholder we are about to replace. */
      #unity-logo {
        position: relative;
        width: 180px; height: 180px; margin: 0 auto 12px;
        background: none;
      }
      #unity-logo.gb-fallback {
        background: url('TemplateData/game-icon.png') center / contain no-repeat;
      }

      /* Tenant logo, layered ON TOP of the static icon. Starts hidden and is only revealed
         after the image has fully decoded, so a broken/slow URL never blanks the icon. */
      #gb-tenant-logo {
        position: absolute; inset: 0;
        background-position: center; background-repeat: no-repeat; background-size: contain;
        opacity: 0; transition: opacity .25s ease;
      }
      #gb-tenant-logo.gb-ready { opacity: 1; }

      /* Spinner centred INSIDE the 180px icon box, kept small enough not to spill past it and
         collide with the progress bar underneath. A different hue from the bar's fill (#5AB81F) so it
         reads as a separate element against the dark backdrop. */
      #gb-spinner {
        position: absolute; left: 50%; top: 50%;
        width: 44px; height: 44px; margin: -22px 0 0 -22px;
        border: 4px solid rgba(255,255,255,0.18);
        border-top-color: #FFCF57;                /* the HUD's gold digits */
        border-radius: 50%;
        animation: gb-spin 0.8s linear infinite;
      }
      @keyframes gb-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #gb-spinner { animation-duration: 3s; }
      }
      #unity-progress-bar-empty {                 /* track */
        width: 300px; height: 18px; margin: 12px auto 0;
        background: #d9d9d9 !important; background-image: none !important;
        border-radius: 9px; overflow: hidden;
      }
      #unity-progress-bar-full {                  /* fill */
        width: 0%; height: 100%;
        background: #EE6A1C !important; background-image: none !important;   /* the START plate's fire (the key art) */
        margin-top: 0 !important;                 /* fix: default style.css pushes it down */
        border-radius: 9px; transition: width 0.1s ease;
      }
      #unity-progress-percent {                   /* % readout */
        color: #F2F2F2; font: 14px arial, sans-serif; margin-top: 6px;
      }

      /* No footer in this build. */
      #unity-footer { display: none !important; }
      #unity-warning {
        position: absolute; left: 50%; top: 5%; transform: translate(-50%);
        background: white; padding: 10px; display: none; z-index: 20;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=621 height=1344 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo">
          <div id="gb-tenant-logo"></div>
          <div id="gb-spinner"></div>
        </div>
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
        <div id="unity-progress-percent">0%</div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      // ===== Dynamic loading-screen icon (GameBull /context) =====
      // The loading screen is painted BEFORE Unity boots, so C# cannot set this icon — the fetch
      // has to happen here, in the template's own JS. Fire-and-forget: nothing awaits it and it
      // never blocks the Unity download. Every failure path lands on the baked-in icon.
      (function loadTenantIcon() {
        // Keep in step with the GameBull API base used by the game bridge. Edit that, not this — on its own, this only moves the loading-icon
        // lookup and leaves the game itself pointed at the other environment.
        var DEFAULT_API_BASE = "https://api.staging.g-b.store";   // staging
        var DEFAULT_GAME_ID  = "ZOMBIE_BATTLE_MATCH";

        // Two different clocks. The one that used to exist ABORTED the lookup at 4 s and painted
        // the built-in icon for good — but this request races the game's own ~80 MB download, so
        // on mobile data it routinely took longer, and a tester on a phone never saw the tenant's
        // icon while it showed every time on fast Wi-Fi (reproduced: an API answering at 6 s left
        // the built-in icon up for the whole load). Now 4 s only stops the spinner and shows the
        // built-in icon; the lookup keeps going, and the tenant's icon replaces it the moment it
        // arrives, for as long as the loading screen is up.
        var SHOW_BUILTIN_AFTER_MS = 4000;
        var GIVE_UP_AFTER_MS      = 30000;

        var spinner = document.querySelector("#gb-spinner");
        var target  = document.querySelector("#gb-tenant-logo");
        var iconBox = document.querySelector("#unity-logo");
        var builtinTimer = null;

        // No tenant icon (yet): stop spinning and paint the static game icon, so the loading
        // screen never sits on an endless spinner or an empty box.
        function showBuiltin() {
          if (iconBox) iconBox.classList.add("gb-fallback");
          stopSpinner();
        }
        function fallback() {
          clearTimeout(builtinTimer);
          showBuiltin();
        }
        function stopSpinner() {
          if (spinner && spinner.parentNode) spinner.parentNode.removeChild(spinner);
        }

        try {
          var q = new URLSearchParams(window.location.search);

          // Same precedence GameBullBoot.cs uses: sessionToken -> bootToken -> token.
          var token      = q.get("sessionToken") || q.get("bootToken") || q.get("token");
          var tenantSlug = q.get("tenantSlug");
          var apiBase    = (q.get("apiBase") || DEFAULT_API_BASE).replace(/\/+$/, "");
          var gameId     = q.get("gameId") || DEFAULT_GAME_ID;

          // No credentials -> nothing to fetch. Not an error; just keep the static icon.
          if (!tenantSlug || !token) { fallback(); return; }

          builtinTimer = setTimeout(showBuiltin, SHOW_BUILTIN_AFTER_MS);

          // AbortController only for a request that is truly hung, long after the built-in icon.
          var ctrl = ("AbortController" in window) ? new AbortController() : null;
          var giveUp = setTimeout(function () { if (ctrl) ctrl.abort(); }, GIVE_UP_AFTER_MS);

          var url = apiBase + "/play/games/" + encodeURIComponent(gameId) +
                    "/context?tenantSlug=" + encodeURIComponent(tenantSlug);

          fetch(url, {
            method: "GET",
            headers: { "Authorization": "Bearer " + token },
            signal: ctrl ? ctrl.signal : undefined
          })
            .then(function (r) { return r.ok ? r.json() : null; })   // 401/404 -> null -> fallback
            .then(function (data) {
              clearTimeout(giveUp);
              var c = data && data.customization;

              // PER-GAME fields only, in this order. logoUrl / tenantLogoUrl / assets[] are
              // tenant-wide and on a shared tenant they return a DIFFERENT game's artwork, so
              // they are deliberately never consulted here.
              var iconUrl =
                (c && typeof c.gameLogoUrl   === "string" && c.gameLogoUrl)   ? c.gameLogoUrl   :
                (c && typeof c.gameBannerUrl === "string" && c.gameBannerUrl) ? c.gameBannerUrl : null;

              if (!iconUrl || !target) { fallback(); return; }

              // Preload and only reveal once decoded, so a broken URL never flashes. NO
              // crossOrigin: the image is only ever painted as a CSS background, never read back,
              // so it needs no CORS — and asking for it made the load FAIL whenever the image host
              // sent no Access-Control-Allow-Origin, or the device had the same image cached from
              // a plain <img> (the GameBull portal's game list) without it (reproduced).
              var img = new Image();
              img.onload = function () {
                clearTimeout(builtinTimer);
                if (!target.parentNode) return;   // the game started first; nothing to show
                target.style.backgroundImage = 'url("' + iconUrl.replace(/"/g, '%22') + '")';
                target.classList.add("gb-ready");
                stopSpinner();
                // If the built-in icon went up while waiting, take it down once the tenant's has
                // faded in over it — a tenant icon with transparent areas would show it through.
                setTimeout(function () { if (iconBox) iconBox.classList.remove("gb-fallback"); }, 300);
              };
              img.onerror = fallback;
              img.src = iconUrl;
            })
            .catch(function () { clearTimeout(giveUp); fallback(); });   // network / abort / CORS
        } catch (e) {
          fallback();   // URLSearchParams or fetch unavailable
        }
      })();

      var canvas = document.querySelector("#unity-canvas");

      // ===== Fill the viewport; letterbox only beyond the shapes the game supports =====
      // Zombie Battle Match is a portrait phone game laid out at exactly 9:16: its camera has a fixed
      // orthographic size over a 7-wide board, so a narrower canvas would cut the board's sides (and a
      // wider one shows the street's edge). The client's own page framed it at 9:16 (aspect-ratio 9/16).
      //   wider than 9:16 (desktop, tablets): letterbox left and right, as the other GameBull games do
      //   narrower than 9:16 (tall phones): letterbox top and bottom
      var MAX_ASPECT = 9 / 16, MIN_ASPECT = 9 / 16;
      function resizeCanvas() {
        var availW = window.innerWidth, availH = window.innerHeight, a = availW / availH, w, h;
        if (a > MAX_ASPECT)      { h = availH; w = Math.round(h * MAX_ASPECT); }
        else if (a < MIN_ASPECT) { w = availW; h = Math.round(w / MIN_ASPECT); }
        else                     { w = availW; h = availH; }
        canvas.style.width  = w + "px";
        canvas.style.height = h + "px";
        canvas.style.left   = Math.round((availW - w) / 2) + "px";
        canvas.style.top    = Math.round((availH - h) / 2) + "px";
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      // ===== Single source of truth for the loading bar + percent =====
      function setLoadProgress(p) {
        var pct  = Math.round(p * 100);
        var full = document.querySelector("#unity-progress-bar-full");
        var txt  = document.querySelector("#unity-progress-percent");
        if (full) full.style.width = pct + "%";
        if (txt)  txt.innerText    = pct + "%";
      }

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function () { warningBanner.removeChild(div); updateBannerVisibility(); }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/buildStaging.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/buildStaging.data",
        frameworkUrl: buildUrl + "/buildStaging.framework.js",
        codeUrl: buildUrl + "/buildStaging.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Brave Giant Entertainment",
        productName: "Zombie Battle Match",
        productVersion: "0.1.5",
        showBanner: unityShowBanner,
        // Render buffer tracks the CSS (letterboxed) canvas size -> responsive, no distortion.
        matchWebGLToCanvasSize: true,
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, setLoadProgress).then((unityInstance) => {
          window.unityInstance = unityInstance;

          // Force 100% before hiding (Unity's onProgress plateaus at 0.9).
          setLoadProgress(1);

          // Safari/WebKit keeps painting loading elements even after display:none on a parent.
          // Hide each explicitly, clear its background image, then REMOVE it from the DOM.
          function killEl(sel) {
            var el = document.querySelector(sel);
            if (!el) return;
            el.style.display = "none";
            el.style.visibility = "hidden";
            el.style.opacity = "0";
            el.style.backgroundImage = "none";
            if (el.parentNode) el.parentNode.removeChild(el);
          }
          killEl("#gb-spinner");        // tenant-icon additions must be torn down too,
          killEl("#gb-tenant-logo");    // or Safari keeps painting them over the game
          killEl("#unity-logo");
          killEl("#unity-progress-bar-full");
          killEl("#unity-progress-bar-empty");
          killEl("#unity-progress-percent");
          killEl("#unity-loading-bar");

          // The backdrop is a LOADING backdrop, and it has to come down with the rest of the
          // loading UI. #unity-container is the FULL VIEWPORT while the canvas is letterboxed
          // inside it, so the rule that sets the image (search: "#unity-container" in the
          // <style> block above) is also what paints the LETTERBOX BARS. Leave it set and a
          // band of blurred key art sits above and below the game for the whole session, with
          // a visible seam at the canvas edge — which does not read as a loading leftover, it
          // reads as the game rendering wrong.
          //
          // #0e0e12 must stay identical to the fallback colour in that CSS rule.
          var container = document.querySelector("#unity-container");
          if (container) container.style.background = "#0e0e12";

          resizeCanvas();

          // ===== Page <-> game bridge (GameBull) =====
          // Zombie Battle Match reads its boot params straight from the URL query string in
          // GameBullBoot, so we only announce readiness here. If a SendMessage-style
          // handshake is ever needed, forward the payload via
          // unityInstance.SendMessage('<BridgeObject>', '<Method>', payload).
          try { window.parent.postMessage({ type: 'game:ready' }, '*'); } catch (e) {}
        }).catch((message) => { alert(message); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
